# 知识库目录：范围、来源、密级。出表程序读发布产物，不直接读本文件。
scope:
  answers:
    - 当份 DPR 句子/表格应对到 120 项清单的哪一条
    - 易混条目如何互斥（P1/P3、升压/非升压、三种纹波等）
    - 规格常见写法（强别名）与单位形态
    - 物理量之间的关系：读表、校验；当份规格书已出现的量可按已登记公式推算缺项（局部对应）
  does_not:
    - 用行业常识或清单「参考示例」填写抽出值
    - 用知识库里的典型值填格
    - 把「符合欧姆定律」等定律名称原句当成抽出值
    - 用 .krow/lessons 或 AGENTS.md 填写抽出值
    - 开放问答、跨项目通用知识、甲方业务系统数据
    - agent.run 开放规划
  owner: 甲方确认口径；乙方整理卡片与发布
  site: 指定场所内使用，整库与规格书均不出公网

