<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>电子电器 · SOR填表</title>
  <link rel="icon" type="image/png" href="/static/app-icon.png" />
  <link rel="stylesheet" href="/static/styles.css?v=20260831c" />
</head>
<body>
  <div class="app">
    <header>
      <div class="shell">
        <div class="brand">
          <i class="mark" aria-hidden="true"></i>
          <div class="brand-text">
            <div class="brand-name">电子电器 · <span>SOR填表</span></div>
            <div class="brand-sub" id="brand-sub">本机工位</div>
          </div>
        </div>
        <div class="header-right">
          <span id="who-wrap" class="who-chip" hidden>
            <span class="who-label">账号</span>
            <strong id="who"></strong>
          </span>
          <button id="logout" type="button" class="ghost header-btn" hidden>退出</button>
        </div>
      </div>
    </header>
    <main>
      <div class="hero">
        <p class="kicker" id="kicker">工位登录</p>
        <h1 id="title">登录后<span>出表</span></h1>
        <p class="lead" id="lead">请使用开通的邮箱和密码，不要填手机号。</p>
        <p id="health" class="health"><i class="dot"></i><span id="health-text">正在检查…</span></p>
      </div>

      <div id="login-card" class="card">
        <div class="card-head">
          <h2 class="card-title">账号登录</h2>
          <p class="card-desc">与开通环境使用同一邮箱。登录后自动领取出表凭据。</p>
        </div>
        <label>邮箱
          <input id="user" type="text" autocomplete="username" placeholder="name@example.com" />
        </label>
        <label>密码
          <span class="pass-wrap">
            <input id="pass" type="password" autocomplete="current-password" />
            <button id="pass-toggle" type="button" class="pass-toggle" aria-label="显示密码" title="显示密码">
              <svg class="eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.6"/>
                <path d="M4 4l16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </span>
        </label>
        <div class="actions">
          <button id="login" type="button">登录</button>
        </div>
        <p id="login-msg" class="msg" hidden></p>
      </div>

      <div id="work-card" class="card" hidden>
        <div class="toolbar">
          <label class="model-pick">识别模型
            <select id="model"></select>
          </label>
        </div>
        <div id="drop" class="drop" tabindex="0" role="button" aria-label="选择规格书">
          <div class="idle">
            <div class="drop-icon" aria-hidden="true">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <rect x="8" y="4" width="18" height="24" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M18 4v8h8" stroke="currentColor" stroke-width="1.6"/>
                <path d="M12 22h10M12 26h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <circle cx="28" cy="28" r="7" fill="#fff" stroke="currentColor" stroke-width="1.6"/>
                <path d="M28 24.5v7M24.5 28h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="drop-title">拖入规格书，或点击选择</div>
            <div class="drop-hint" id="drop-hint">文件只在本机读取，不超过 80MB</div>
            <div class="chips">
              <span>PDF</span><span>Word</span><span>Excel</span>
            </div>
          </div>
          <div class="file-meta">
            <div class="file-mark" aria-hidden="true">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <rect x="6" y="3" width="13" height="18" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M13 3v6h6" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            </div>
            <div class="file-copy">
              <div class="drop-kicker">已选择规格书</div>
              <div id="fname" class="file-name"></div>
              <div id="fsize" class="file-size"></div>
            </div>
          </div>
        </div>
        <input id="file" class="sr-only" type="file" accept=".pdf,.docx,.xlsx,.xlsm" />
        <div class="actions">
          <button id="pick" type="button">选择文件</button>
          <button id="go" type="button" disabled>开始出表</button>
          <button id="pause" type="button">暂停</button>
          <button id="stop" type="button">结束</button>
        </div>
        <div id="progress" class="progress">
          <div class="steps" role="list">
            <div id="st-read" class="step" role="listitem">
              <b>1</b><span class="step-name">读取</span>
              <span class="step-desc">打开规格书，拆成可检索正文</span>
            </div>
            <div id="st-ocr" class="step" role="listitem">
              <b>2</b><span class="step-name">扫描识别</span>
              <span class="step-desc">扫描件才做 OCR；文字稿可跳过</span>
            </div>
            <div id="st-extract" class="step" role="listitem">
              <b>3</b><span class="step-name">抽取</span>
              <span class="step-desc">规则先填，模型只补空缺项</span>
            </div>
            <div id="st-write" class="step" role="listitem">
              <b>4</b><span class="step-name">出表</span>
              <span class="step-desc">按模板写出页码与原文摘录</span>
            </div>
          </div>
          <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
          <div id="status" class="status"></div>
        </div>
        <div id="result" class="result"></div>
      </div>
    </main>
  </div>
  <script src="/static/app.js?v=20260831c" defer></script>
</body>
</html>
