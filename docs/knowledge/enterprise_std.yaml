# Q/JLP 030602-07-2026A 电机控制器设计验证规范（结构化摘录）
# 保密一级原文不入库。本文件只收定义、试验方法引用、与 120 项对照。
# fill 必须为 false。评价准则多为「满足当份 DPR」；本企标不是填格答案库。
fill: false
std_id: Q/JLP 030602-07-2026A
title: 电机控制器设计验证规范
classification: 保密一级
coverage: 第3章定义；6.2–6.36 零部件试验；第7章及 7.1–7.9 整机试验。7.10 NVH、第8章整车未收。
rule: 抽出值只来自当份 DPR。本企标提供试验方法、定义与认条对照，不提供抽出值。

terms:
  - name: 驱动电机控制器
    gloss: 调节驱动电机电流、电压、频率等，使电机按指令输出转速和转矩的装置。
    see_seq: []
  - name: DHT
    gloss: 混合动力变速器（Dedicated Hybrid Transmission）。振动等试验的 DUT 常要求为 DHT 整机，不是控制器单件。
    see_seq: [75, 103]
  - name: 直流母线电压
    gloss: 驱动电机控制器的直流高压动力端电压。抽出值仍只来自当份 DPR 工况表。
    see_seq: [5, 6, 7]
  - name: 额定电压
    gloss: 制造厂规定的控制器设计电压。不是试验箱默认值。
    see_seq: [5]
  - name: 持续电流
    gloss: 规定条件下交流侧可长时间持续工作的最大电流。企标明确为交流侧，不是直流母线电流。
    see_seq: [43, 58]
  - name: 峰值电流
    gloss: 规定时间内交流侧可短时工作的最大电流。企标明确为交流侧。
    see_seq: [44, 60]
  - name: 最高工作转速
    gloss: 驱动电机在弱磁控制下可达到的最高工作转速。
    see_seq: [35, 52]
  - name: 主动放电
    gloss: 下电后由控制器主动把母线电压放到安全电压以下。时间与安全电压看当份 DPR。
    see_seq: [15]
  - name: 被动放电
    gloss: 无控制时经泄放回路自然放电。时间与安全电压看当份 DPR。
    see_seq: [16]
  - name: 效率
    gloss: 输出机械功率与输入电功率之比（Pout/Pin）。边界（电压/扭矩/转速）看当份 DPR。
    see_seq: [41, 56]
  - name: 运行时间
    gloss: 电机控制器设计的可运行时间。具体小时数/年数只取当份 DPR，不用企标举例口径。
    see_seq: [107]
  - name: 寿命周期及温度分布
    gloss: 寿命周期内的运行时间以及环境/冷却液温度分布。分布和时长只取当份 DPR。
    see_seq: [98, 107]

