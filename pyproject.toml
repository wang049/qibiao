[project]
name = "electrical-krow"
version = "0.1.0"
description = "电子电器 · SOR填表（登录后出表）"
requires-python = ">=3.11"
dependencies = [
    "krow-agent-sdk[office]>=0.9.3.1",
    "httpx>=0.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "pywebview>=5.0",
]

[project.scripts]
electrical-krow = "electrical_krow.__main__:main"
electrical-krow-mock = "electrical_krow.mock_server:main"
electrical-krow-probe = "electrical_krow.probe:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["electrical_krow*"]

[tool.setuptools.package-data]
electrical_krow = ["frontend/*"]
