[krow]
; 识别服务根地址，不要尾斜杠，不要带 /v1。
; 仪表盘「快速开始」Base URL 是 https://rdapi.aurobaytech-t.com/v1，这里只写根地址。
; 不要填门户 rdagents 或控制台 rdweb。本机联调可改回 https://api.krow.cn。
server_url = https://rdapi.aurobaytech-t.com
; 默认 chat 模型。现场若没有 deepseek-v4-pro，改成登录后清单里的 chat 模型 id。
; 不要填 OCR/表格类（如 krow-ocr-table）。
chat_model = deepseek-v4-pro
timeout_sec = 180
gateway_host = 127.0.0.1
gateway_port = 18765
; 客户端只绑本机。场所网页才改 delivery = site（仍建议绑 127.0.0.1，由 nginx 转发）。
delivery = client
