# 电驱需求拆解的对照库。不提供规格数值，不开选段检索。
# sources 只登记本机资料的名称和用途，不含文件正文，也不含本机路径。
# 初步处理意见待专家抽检。确认前不写入需求清单的意见栏。
id: arch
title: 电驱对照知识库
version: 2026-11-12.1
fill_from_kb: false
leave_site: false
retrieve: false
rule: 说明当份材料怎么对照，并给出初步处理意见和理由。意见不写满足或不满足。库不提供电压、重量或其他规格值。
scope:
  answers:
  - 同一条里的中文和英文数值是否一致
  - 同一份文件里写明的重量上限和别处的重量是否冲突
  - 同一份文件里输出电压范围、机械冲击加速度前后是否一致
  - 封面和目录不参与上述核对
  - 当份点名的标准、图号或接口能否对上来源登记
  - 对得上时初步处理意见和理由怎么写
  - 对不上时如何写明尚无对应口径
  does_not:
  - 用知识库、上一份文件或常识填写拆解表
  - 把电机控制器知识库的条款典型值拿来当架构规格
  - 给当份没有写出的量补一个数
  - 把已登记标准、图纸或评论里的限值写成初步意见
  - 开放问答，或跨项目通用知识
  owner: 来源已登记。处理意见待专家抽检。改口径须同时改卡片和对应测试
  site: 指定场所内使用，不出公网
cards:
- id: arch-bilingual-number
  group: 中英对照
  title: 同条中英数值要一致
  status: active
  applies: 同一条原文里，中文和英文都给出了同一单位的数。
  gloss: 同一条原文里，中文和英文都给出了同一单位的数时，两边的数应当相同。不同则标为中英数值冲突。
  opinion: 标为中英数值冲突，请对照这一条原文确认以哪一侧为准。
  reason: 命中卡片 arch-bilingual-number。当份这一条两种语言都写出了数，而且不一致。
  use: 文件质检只标冲突，不改原文，不把任一边的数写成抽出值。
  does_not:
  - 只有一种语言写出的数，不另造另一种语言的数
  - 单位不同的数不互相改写
  - 不把其中一侧写成满足
- id: arch-same-file-weight
  group: 同文件核对
  title: 同文件重量不得超出该文件写明的上限
  status: active
  applies: 同一份文件里写了重量上限，别处又给出重量。
  gloss: 同一份文件里写了重量上限，又在别处给出更大的重量，标为冲突。上限和超出的数都要出现在这份文件里。
  opinion: 标为同文件重量冲突，请按这份文件写明的上限核对。
  reason: 命中卡片 arch-same-file-weight。上限和更大的重量都出现在当份文件里。
  use: 封面和目录不参与。表格块说明行不参与。
  does_not:
  - 不用另一份文件的重量来判这份文件
  - 不把上限写成这份文件没有写出的推荐值
- id: arch-same-file-spec
  group: 同文件核对
  title: 同文件关键规格前后要一致
  status: active
  applies: 同一份文件里，输出电压范围或机械冲击加速度前后都写了。
  gloss: 同一份文件里，输出电压范围或机械冲击加速度前后写法不一致时标为冲突。
  opinion: 标为同文件规格前后不一致，请按当份原文核对适用条件。
  reason: 命中卡片 arch-same-file-spec。输出电压范围或机械冲击加速度在当份文件里前后写法不一致。
  use: 封面和目录不参与。只核对当份已经抽出的条目。
  does_not:
  - 不补当份没有写出的电压范围或冲击加速度
  - 不把不同适用条件的数强行合成一个数
- id: arch-same-file-power
  group: 同文件核对
  title: 同文件功率前后要一致
  status: active
  applies: 同一份文件里，功率前后都写了。
  gloss: 同一份文件里，功率前后写法不一致时标为冲突。两处的数都要出现在这份文件里。
  opinion: 标为同文件功率不一致，请按当份原文核对适用条件。
  reason: 命中卡片 arch-same-file-power。功率在当份文件里前后写法不一致。
  use: 只核对当份已经抽出的条目。
  does_not:
  - 不把两处功率合成一个数
  - 不把其中一处写成满足
- id: arch-current-file
  group: 边界
  title: 只对照当次读入的文件
  status: active
  applies: 要判断冲突、中英或前后是否一致。
  gloss: 中英对照、同条逻辑和跨章节冲突都限在当次读入的材料。
  opinion: 只根据当次读入的文件给出对照，不引用其他项目的规格。
  reason: 命中卡片 arch-current-file。冲突和待核对都限在当次材料。
  use: 质检可以对照当份中英和内部逻辑，不填格。
  does_not:
  - 不交叉使用电机控制器知识库里的典型值
  - 不把上一份架构文档的规格抄进这一份
- id: arch-chart-screenshot
  group: 出表
  title: 曲线图整张截图，旁边的数据表不裁开
  status: active
  applies: 当份页面上有曲线，或曲线旁边有数据表。
  gloss: 任何输入文件都按同一套规则。一张曲线连同它自己旁边的数据表是一张截图。同一页有多张曲线时不合成一张图。截图含整张表，不从格子中间裁开。纯数字数据表只留在截图里，不摘录、不翻译。图框上方的页眉标题、编号条款、曲线标题和说明按行摘录并翻译。同一行原文和它的译文写在一起。
  opinion: 这条按整张曲线截图处理，旁边的数据表留在同一张图里，纯数字表不另写摘录。
  reason: 命中卡片 arch-chart-screenshot。当份这一处是曲线，或曲线旁边有数据表。
  use: 出表按此执行。不看文件名，也不限转速、噪声这两个词。带 Table、Load、Speed rate 的规格表仍按原列画出，不并进曲线截图。
  does_not:
  - 不把曲线横轴刻度写成表
  - 不把纯数字数据表写成摘录或翻译
  - 不从数据表半格处裁截图
  - 不把同一页的多张曲线合成一张图
  - 不漏掉图框上方的页眉标题
  - 不把一条编号条款的原文从句中折断或截掉
- id: arch-cite-standard
  group: 处理意见
  title: 点名的标准只引已登记的标准号
  status: draft
  applies: 当份需求写出的标准号，能在来源登记的标准里对上。
  gloss: 意见可以写对照这份已登记标准的对应条款。标准里的限值不进入卡片，也不写成这条需求的要求。
  opinion: 对照该标准的对应条款。限值以当份原文为准。
  reason: 写来源编号、标准号，以及当份点名该标准的原句。
  use: 对得上登记才引用。对不上就改走尚无对应口径。
  does_not:
  - 不把标准里的限值写成这条的要求
  - 不对不上标准号时改指一份邻近标准
  - 不把标准文本送出场所
- id: arch-cite-drawing
  group: 处理意见
  title: 点名的图号只引已登记的图纸
  status: draft
  applies: 当份需求写出的图号，能在来源登记的图纸里对上。
  gloss: 意见指向当份点名的那张图。零件、材料和重量只取该图，不取其他图。
  opinion: 核对当份点名的那张图。零件和材料以该图为准。
  reason: 写图纸来源编号、图号，以及当份点名该图的原句。
  use: 图号对得上才引用。零件表仍按当份图纸读取。
  does_not:
  - 不把其他图的重量或材料写到这条
  - 不把图号登记当成已经读出的抽出值
- id: arch-cite-interface
  group: 处理意见
  title: 点名的接口只引已登记的版本
  status: draft
  applies: 当份需求点名 ICD、HSI 或原理图，且来源登记里有这份文件。
  gloss: 意见按登记的接口文件核对对象和版本。脚位和网络只取当份那一版。
  opinion: 按已登记的接口文件核对对象和版本。脚位以当份文件为准。
  reason: 写接口来源编号、版本，以及当份点名该文件的原句。
  use: 版本对得上才引用。另一版的脚位不代入。
  does_not:
  - 不把另一版本的脚位写进这条
  - 不用控制器清单的典型值代替接口定义
- id: arch-prior-comment
  group: 处理意见
  title: 已有评论只沿用同一条原文
  status: draft
  applies: 来源登记里的偏差跟踪有同一条款的评论，且当份原文与该行原文一致。
  gloss: 初步意见可以转述该行评论的处理方向，并标明来自该表、待专家确认。
  opinion: 转述该行已有评论的处理方向，标明待专家确认。
  reason: 写偏差跟踪的来源编号、条款号，以及当份对得上的原句。
  use: 原文不一致时不沿用。评论不改写成满足或不满足。
  does_not:
  - 不把该表里的数值写到对不上的条款
  - 不把评论改写成满足或不满足
  - 原文不一致时不沿用上一份评论
- id: arch-no-source
  group: 处理意见
  title: 对不上登记时明确尚无口径
  status: draft
  applies: 当份条款对不上已登记的标准、图号、接口或同文件冲突，也没有同一条原文的已有评论。
  gloss: 两条都要有字：意见说明知识库尚无对应口径，理由说明核对过哪些登记。
  opinion: 知识库尚无对应口径，需专家给出处理意见。
  reason: 已按来源登记核对，没有对上的标准号、图号、接口文件或同文件冲突。
  use: 用这句话占住意见和理由，不留空，也不另编技术结论。
  does_not:
  - 不编造技术结论
  - 不写满足或不满足
  - 不拿其他项目的规格填上
