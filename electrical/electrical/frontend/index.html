<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>电子电器 · SOR填表</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260909a" />
</head>
<body>
  <div class="app">
    <header>
      <div class="shell">
        <div class="brand">
          <i class="mark" aria-hidden="true"></i>
          <div class="brand-name">电子电器 · <span>SOR填表</span></div>
        </div>
        <div class="privacy">规格书不出公网</div>
      </div>
    </header>
    <main>
      <p class="kicker">本机抽取，生成核对表</p>
      <h1>导入规格书，<em>本机出表</em></h1>
      <p class="lead">拖入 PDF / Word / Excel，本机抽取后下载可核对表。</p>
      <div class="card">
        <p id="health" class="health"><i class="dot"></i>正在检查本机识别…</p>
        <div id="drop" class="drop" tabindex="0" role="button" aria-label="选择规格书">
          <div class="idle">
            <div class="drop-icon" aria-hidden="true">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <rect x="8" y="4" width="18" height="24" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M18 4v8h8" stroke="currentColor" stroke-width="1.6"/>
                <path d="M12 22h10M12 26h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <circle cx="28" cy="28" r="7" fill="#fff" stroke="currentColor" stroke-width="1.6"/>
                <path d="M28 24.5v7M24.5 28h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="drop-title">拖入文件，或点击选择</div>
            <div class="drop-hint">不超过 80MB</div>
            <div class="chips">
              <span>PDF</span><span>Word</span><span>Excel</span>
            </div>
          </div>
          <div class="file-meta">
            <div class="drop-kicker">已选择</div>
            <div id="fname" class="file-name"></div>
            <div id="fsize" class="file-size"></div>
          </div>
        </div>
        <input id="file" class="sr-only" type="file" accept=".pdf,.docx,.xlsx,.xlsm" />
        <div class="actions">
          <button id="pick" type="button">选择文件</button>
          <button id="go" type="button" disabled>开始出表</button>
          <button id="pause" type="button">暂停</button>
          <button id="stop" type="button">结束</button>
        </div>
        <div id="progress" class="progress">
          <div class="steps">
            <div id="st-read" class="step">读取</div>
            <div id="st-ocr" class="step">扫描识别</div>
            <div id="st-qc" class="step">质检</div>
            <div id="st-extract" class="step">抽取</div>
            <div id="st-write" class="step">出表</div>
          </div>
          <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
          <div id="status" class="status"></div>
        </div>
        <div id="result" class="result"></div>
      </div>
    </main>
  </div>
  <script src="/static/app.js?v=20260909d" defer></script>
</body>
</html>
