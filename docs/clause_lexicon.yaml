items:
- id: 1
  name: 设计范围是否包含OD本体物理集成
  group: 设计范围
  gloss: 是否把 OD 单元的本体在物理上集成进 XCM 控制器（影响控制器架构）
  zh_strong:
  - OD本体
  - OD集成
  - OD物理集成
  - 物理集成
  - 本体集成
  - 集成OD
  - OD一体化
  zh_weak: []
  en_strong:
  - OD integration
  - integrated OD
  - physical integration
  - OD physically integrated
  en_weak: []
  cues:
  - 是/否
  - Y/N
  - yes/no
  std: []
  exclude:
  - 静态电流 ≤xxx mA 包含OD（→#22）
  - 油泵上移（→#2）
  see:
  - 2
  - 22
  notes:
  - 'OD 缩写在清单中未定义；由 #2「油泵上移」与 #22「XCM休眠，包含OD」可判断 OD 为一个带静态功耗的电气单元，很可能与油泵驱动相关，但原字典的 "oil distribution" 是推测，未经核实'
  - 建议向甲方确认 OD 全称后再补英文长别名；当前只用 "OD" 作段落定位词
  unverified:
  - oil distribution [原字典]
  xlsx:
    example: 是
    desc: ''
    impact: 影响控制器架构设计
