[krow]
; 场所网页：同一套出表程序，部署在甲方指定场所内网。
; 应用只绑 127.0.0.1，由 nginx HTTPS 转发。不要把本进程直接暴露到公网。
delivery = site
gateway_host = 127.0.0.1
gateway_port = 18765
; 识别服务根地址，不要尾斜杠，不要带 /v1。
; 仪表盘 Base URL 去掉 /v1。不要填门户 rdagents 或控制台 rdweb。
server_url = https://rdapi.aurobaytech-t.com
chat_model = deepseek-v4-pro
timeout_sec = 180
